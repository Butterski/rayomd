name: Release

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version metadata
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(head -n 1 VERSION | tr -d '\r\n ')"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "VERSION must be a numeric CMake project version, got: $version" >&2
            exit 1
          fi
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}; expected ${tag}." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux release binaries
    needs: version
    runs-on: ubuntu-22.04

    env:
      RAYOMD_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            fonts-dejavu-core \
            libcurl4-openssl-dev

      - name: Build default Linux CLI
        run: |
          cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux --config Release
          ./build/linux/rayomd --version
          ./build/linux/rayomd --bench docs/benchmark_smoke.md benchmark-output/linux-release 50 modern normal
          test -s benchmark-output/linux-release/sample.pdf

      - name: Build curl-enabled Linux CLI
        run: |
          cmake -S . -B build/linux-curl -DCMAKE_BUILD_TYPE=Release -DRAYOMD_USE_CURL=ON
          cmake --build build/linux-curl --config Release
          ./build/linux-curl/rayomd --version
          ./build/linux-curl/rayomd --bench docs/benchmark_smoke.md benchmark-output/linux-curl-release 50 modern normal
          test -s benchmark-output/linux-curl-release/sample.pdf

      - name: Build fully static Linux CLI
        run: |
          cmake -S . -B build/linux-static -DCMAKE_BUILD_TYPE=Release -DRAYOMD_STATIC=ON
          cmake --build build/linux-static --config Release
          ./build/linux-static/rayomd --version
          ./build/linux-static/rayomd --bench docs/benchmark_smoke.md benchmark-output/linux-static-release 50 modern normal
          test -s benchmark-output/linux-static-release/sample.pdf
          if ldd build/linux-static/rayomd >/dev/null 2>&1; then
            echo "The static Linux CLI must not be a dynamic executable." >&2
            exit 1
          fi

      - name: Package Linux assets
        run: |
          default_name="rayomd-${RAYOMD_VERSION}-linux-x64"
          curl_name="rayomd-${RAYOMD_VERSION}-linux-x64-curl"
          static_name="rayomd-${RAYOMD_VERSION}-linux-x64-static"

          mkdir -p "dist/${default_name}" "dist/${curl_name}" "dist/${static_name}"
          cp build/linux/rayomd "dist/${default_name}/rayomd"
          cp build/linux-curl/rayomd "dist/${curl_name}/rayomd"
          cp build/linux-static/rayomd "dist/${static_name}/rayomd"
          cp README.md LICENSE NOTICE VERSION "dist/${default_name}/"
          cp README.md LICENSE NOTICE VERSION "dist/${curl_name}/"
          cp README.md LICENSE NOTICE VERSION "dist/${static_name}/"

          tar -czf "${default_name}.tar.gz" -C dist "${default_name}"
          tar -czf "${curl_name}.tar.gz" -C dist "${curl_name}"
          tar -czf "${static_name}.tar.gz" -C dist "${static_name}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rayomd-linux-release
          path: |
            rayomd-${{ needs.version.outputs.version }}-linux-x64.tar.gz
            rayomd-${{ needs.version.outputs.version }}-linux-x64-curl.tar.gz
            rayomd-${{ needs.version.outputs.version }}-linux-x64-static.tar.gz
          if-no-files-found: error

  windows:
    name: Windows release binary
    needs: version
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Build Windows CLI
        run: |
          cmake -S . -B build/windows -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/windows --config Release
          ./build/windows/rayomd.exe --version
          ./build/windows/rayomd.exe --bench docs/benchmark_smoke.md benchmark-output/windows-release 50 modern normal
          test -s benchmark-output/windows-release/sample.pdf

      - name: Package Windows asset
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $name = "rayomd-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item "build\windows\rayomd.exe" "dist\$name\rayomd.exe"
          Copy-Item README.md, LICENSE, NOTICE, VERSION "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "$name.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayomd-windows-release
          path: rayomd-${{ needs.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, linux, windows]
    runs-on: ubuntu-22.04

    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RAYOMD_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4

      - name: Create or update release assets
        run: |
          files=(
            "rayomd-linux-release/rayomd-${RAYOMD_VERSION}-linux-x64.tar.gz"
            "rayomd-linux-release/rayomd-${RAYOMD_VERSION}-linux-x64-curl.tar.gz"
            "rayomd-linux-release/rayomd-${RAYOMD_VERSION}-linux-x64-static.tar.gz"
            "rayomd-windows-release/rayomd-${RAYOMD_VERSION}-windows-x64.zip"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "RayoMD ${RAYOMD_VERSION}" \
              --latest
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "RayoMD ${RAYOMD_VERSION}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --latest
          fi

  arch:
    name: Arch Linux packages
    needs: [version, publish]
    runs-on: ubuntu-latest
    container: archlinux:latest

    env:
      RAYOMD_VERSION: ${{ needs.version.outputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      PACKAGER_NAME: Milosz Kucharski
      PACKAGER_EMAIL: miloszkucharski@gmail.com
      # makepkg writes this into each package's metadata.
      PACKAGER: Milosz Kucharski <miloszkucharski@gmail.com>

    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh namcap cmake python ttf-dejavu curl
          useradd -m builder

      # The default branch, not the release ref: the updated PKGBUILDs are committed onto it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update PKGBUILDs
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- packaging/arch/update.sh "$RAYOMD_VERSION"

      - name: Build, check and smoke-test both packages
        run: |
          for pkg in rayomd rayomd-bin; do
            (cd "packaging/arch/$pkg" && runuser -u builder -- makepkg --cleanbuild --noconfirm)
            namcap "packaging/arch/$pkg/PKGBUILD" packaging/arch/$pkg/*.pkg.tar.zst
            pacman -U --noconfirm packaging/arch/$pkg/*.pkg.tar.zst
            rayomd --version | grep -Fx "rayomd ${RAYOMD_VERSION}"
            rayomd --export tester.md /tmp/tester.pdf --no-image-cache
            test -s /tmp/tester.pdf
            pacman -R --noconfirm "$pkg"
          done

      - name: Commit PKGBUILDs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/arch/*/PKGBUILD packaging/arch/*/.SRCINFO
          if git diff --cached --quiet; then
            echo "The PKGBUILDs are already at ${RAYOMD_VERSION}."
            exit 0
          fi
          git commit -m "Arch packages: ${RAYOMD_VERSION}"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      # Needs the repository secret AUR_SSH_PRIVATE_KEY: the private half of a key added to the
      # AUR account that maintains rayomd and rayomd-bin. Without it the step is skipped.
      - name: Publish to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # aur.archlinux.org's ED25519 key, SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          # as the AUR's home page lists it.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config
          for pkg in rayomd rayomd-bin; do
            rm -rf "/tmp/aur-$pkg"
            git -c init.defaultBranch=master clone "ssh://aur@aur.archlinux.org/$pkg.git" "/tmp/aur-$pkg"
            cp "packaging/arch/$pkg/PKGBUILD" "packaging/arch/$pkg/.SRCINFO" "/tmp/aur-$pkg/"
            release="$(sed -n 's/^pkgrel=//p' "packaging/arch/$pkg/PKGBUILD")"
            (
              cd "/tmp/aur-$pkg"
              git add PKGBUILD .SRCINFO
              if git diff --cached --quiet; then
                echo "$pkg is already published at ${RAYOMD_VERSION}-${release}."
              else
                git -c user.name="$PACKAGER_NAME" -c user.email="$PACKAGER_EMAIL" \
                  commit -m "Update to ${RAYOMD_VERSION}-${release}"
                git push origin HEAD:master
              fi
            )
          done
